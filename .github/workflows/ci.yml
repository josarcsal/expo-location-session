name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, lint and codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Using Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: |
          yarn tsc --noEmit
          yarn tsc -p plugin --noEmit

      - name: Lint
        run: yarn lint

      - name: Nitrogen output is up to date
        run: |
          yarn nitrogen
          git diff --exit-code nitrogen/generated
          test -z "$(git status --porcelain nitrogen/generated)"

  ios:
    name: iOS core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        working-directory: ios/Core
        run: swift test

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Using Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: |
          yarn install --immutable
          yarn build:plugin

      - name: Prebuild example
        working-directory: example
        run: |
          yarn install --immutable
          yarn expo prebuild --platform android --no-install

      - name: Unit tests
        working-directory: example/android
        run: ./gradlew :expo-location-session:testDebugUnitTest --no-daemon
