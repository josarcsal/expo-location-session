version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directories:
      - '/example/'
      - '/'
    schedule:
      interval: 'daily'
    labels:
      - 'dependencies'
    groups:
      react-native:
        patterns:
          - '@react-native/*'
      nitro:
        patterns:
          - 'nitrogen'
          - 'react-native-nitro-modules'
